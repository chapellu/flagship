# SOPS configuration — drives `sops --encrypt` for in-repo secrets.
#
# Only the `data` / `stringData` values of any *.enc.yaml file under k8s/ are
# encrypted; the rest of the manifest (kind, metadata, ...) stays readable so
# kustomize and Flux can work with it. Flux's kustomize-controller decrypts
# these at apply time using the `sops-age` secret in flux-system.
#
# Replace the age recipient below with YOUR age public key:
#   age-keygen -o age.agekey            # keep the private key OFFLINE
#   grep '# public key:' age.agekey     # copy the age1... value here
creation_rules:
  - path_regex: k8s/.*\.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1REPLACE_WITH_YOUR_AGE_PUBLIC_KEY
