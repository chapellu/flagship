apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  # SOPS-encrypted secrets — create these from the *.example templates before
  # this Kustomization can reconcile (see README.md). They are decrypted by
  # Flux at apply time.
  - cloud-credentials.enc.yaml
  - repo-credentials.enc.yaml
