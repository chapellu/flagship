apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-traces
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-traces-single
      version: ">=0.1.0 <0.2.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    server:
      # Stable, short service name → http://victoria-traces:10428
      fullnameOverride: victoria-traces
      retentionPeriod: 7d
      retentionDiskSpaceUsage: 4GiB
      persistentVolume:
        enabled: true
        size: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
