# Let's Encrypt production issuer. cert-manager solves the ACME HTTP-01
# challenge through the Gateway API: it spins up a temporary solver Pod +
# Service and a short-lived HTTPRoute attached to the shared Gateway's :80
# listener, so the challenge is served from the same public endpoint as the
# apps. Requires `enableGatewayAPI: true` on the cert-manager controller.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ludovic.chapelet@outllook.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: eg
                namespace: envoy-gateway-system
                kind: Gateway
                sectionName: http
