apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - securitypolicy.yaml
  - referencegrant.yaml
  - cronjob.yaml
  - communes.yaml
  - mailin.yaml
  - mailin.enc.yaml
# Le code du relevé quotidien, monté dans le CronJob. Le suffixe de hash fait
# suivre le CronJob à chaque changement de code.
configMapGenerator:
  - name: terrain-refresh
    namespace: terrain
    options:
      annotations:
        # Flux ne doit pas interpréter les ${…} éventuels du code Python
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - refresh/refresh.py
      - refresh/src_bienici.py
      - refresh/src_notaires.py
      - refresh/src_paruvendu.py
      - refresh/src_alertes.py
  # Le générateur hebdomadaire des fiches communes (communes.yaml).
  - name: terrain-communes
    namespace: terrain
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - communes/build.py
      - communes/lib.py
      - communes/m_bpe.py
      - communes/m_creches.py
      - communes/m_dvf.py
      - communes/m_eau.py
      - communes/m_ecoles.py
      - communes/m_fibre.py
      - communes/m_foret.py
      - communes/m_geo.py
      - communes/m_grid.py
      - communes/m_risques.py
      - communes/m_train.py
      - communes/m_voiture.py
