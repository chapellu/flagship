# terrain.chapellu.fr — coquille statique (apps/terrain) + données montées
# depuis un volume.
#
# Le dépôt et l'image sont publics ; les données (lieux de la famille,
# parcelles visées) ne doivent être ni dans l'un ni dans l'autre. Elles vivent
# dans le PVC terrain-data (pvc.yaml), monté en lecture seule, et Velero les
# sauvegarde chaque nuit. Pour les remplacer : voir apps/terrain/README.md.
#
# Avant le 2026-11-02 c'était un hostPath (/srv/terrain/data), que Velero ne
# sait pas sauvegarder : la recréation du disque de vm-main les a effacées.
#
# Le tag d'image est épinglé par le CI (.github/workflows/terrain-image.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrain
  namespace: terrain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terrain
  template:
    metadata:
      labels:
        app: terrain
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/chapellu/terrain:79219a1acece65b18bcd41aabce03d372eaf90d3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /usr/share/nginx/html/data
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: terrain-data
            readOnly: true
