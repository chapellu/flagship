# Route de l'outil terrain. Contrairement au blog et au prototype, elle est
# protégée : voir securitypolicy.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: terrain
  namespace: terrain
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-terrain
  hostnames:
    - terrain.chapellu.fr
  rules:
    - backendRefs:
        - name: terrain
          port: 80
