# Tracing layer — kept as a SEPARATE Flux Kustomization on purpose.
# VictoriaTraces is a young component; deleting THIS ONE FILE (with prune
# enabled) tears down VictoriaTraces, the OTel Collector and the traces
# datasource cleanly, without touching metrics or logs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-traces
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/monitoring-traces
  prune: true
  wait: true
  # Reuses the monitoring namespace and the Grafana sidecar created by the
  # monitoring Kustomization.
  dependsOn:
    - name: monitoring
