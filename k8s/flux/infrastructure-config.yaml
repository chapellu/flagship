apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infrastructure-config
  prune: true
  dependsOn:
    - name: infrastructure
  # Decrypt cluster-vars.enc.yaml (owner email — personal data kept out of a
  # public repo, not a credential) with the cluster's age key.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
