apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: blog
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/blog
  prune: true
  wait: true
  # Needs the shared Gateway + ClusterIssuer (and, transitively, Envoy Gateway
  # + cert-manager) before the HTTPRoute can be programmed and blog-tls issued.
  dependsOn:
    - name: infrastructure-config
  # No decryption block: the content repo is public, so nothing here is secret.
