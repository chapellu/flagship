# Route publique du prototype. Se branche sur le listener https-proto du
# Gateway partagé (TLS terminée là, cert proto-tls émis par cert-manager).
# Public en lecture, comme le blog — pas de SecurityPolicy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proto-shell
  namespace: proto-shell
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-proto
  hostnames:
    - proto.chapellu.fr
  rules:
    - backendRefs:
        - name: proto-shell
          port: 80
