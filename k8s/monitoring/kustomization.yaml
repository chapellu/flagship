apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - metrics-release.yaml
  - logs-release.yaml
  - grafana-route.yaml
  - grafana-securitypolicy.yaml
  - grafana-datasource-logs.yaml
  # SOPS-encrypted Google OIDC client secret — create it from the
  # *.example template before this Kustomization can reconcile (see
  # README.md). Decrypted by Flux at apply time.
  - oidc-google.enc.yaml
