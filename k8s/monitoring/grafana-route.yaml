# Public route for Grafana. Attaches to the shared Gateway's HTTPS listener
# (TLS terminated there with the cert-manager-issued grafana-tls cert) and
# forwards to the Grafana Service. Auth is enforced before this route by the
# OIDC SecurityPolicy (grafana-securitypolicy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-grafana
  hostnames:
    - grafana.chapellu.eu.org
  rules:
    - backendRefs:
        - name: grafana
          port: 80
