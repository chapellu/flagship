name: Terraform Validate

on:
  pull_request:
    paths:
      - "infra/**"

# Least privilege: this workflow only needs to read the repo contents.
permissions:
  contents: read

jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      # Blocking IaC security scan. tfsec is deprecated and folded into Trivy;
      # this fails the PR on HIGH/CRITICAL misconfigurations instead of the old
      # advisory-only (soft_fail + continue-on-error) setup. Triage initial
      # findings with `trivy config infra` locally and add inline #trivy:ignore
      # comments (with justification) for any you intentionally accept.
      - name: Security scan (Trivy IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
