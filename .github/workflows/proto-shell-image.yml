name: Proto-Shell Image

# Même mécanique que blog-image.yml : construit l'image du prototype, la
# publie sur GHCR puis épingle le SHA dans le manifest — Flux fait le rollout.
on:
  push:
    branches:
      - main
    paths:
      - "apps/proto-shell/**"
      - ".github/workflows/proto-shell-image.yml"
  workflow_dispatch:

permissions:
  contents: write # committe le nouveau tag d'image sur main
  packages: write # pousse sur GHCR

concurrency:
  group: proto-shell-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/proto-shell

jobs:
  build:
    name: Build & publish
    # Nœud unique Ampere A1 : image arm64, build natif sur runner ARM.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/proto-shell
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the new tag in the deployment manifest
        run: |
          set -euo pipefail
          manifest=k8s/proto-shell/deployment.yaml
          sed -i -E "s|(image: ${IMAGE}:).*|\1${GITHUB_SHA}|" "$manifest"
          if git diff --quiet -- "$manifest"; then
            echo "Image tag unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "proto-shell: roll image to ${GITHUB_SHA}"
          # Les pushes faits avec GITHUB_TOKEN ne déclenchent pas de workflow,
          # donc pas de boucle possible.
          git push
