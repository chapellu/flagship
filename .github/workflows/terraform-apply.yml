name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"

jobs:
  apply:
    name: Plan & Apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra

    env:
      TF_VAR_tenancy_ocid:     ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid:        ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint:      ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: /tmp/oci_api_key.pem
      TF_VAR_region:           ${{ secrets.OCI_REGION }}
      TF_VAR_compartment_id:   ${{ secrets.OCI_COMPARTMENT_ID }}
      TF_VAR_ssh_public_key:   ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Write OCI private key
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Init
        run: terraform init

      - name: Plan & Apply (with AD retry for OCI capacity errors)
        shell: bash
        run: |
          set -o pipefail
          # A1.Flex instances frequently hit "Out of host capacity" in a given AD.
          # We re-plan and re-apply for each AD index until one succeeds.
          for ad_index in 0 1 2; do
            echo "--- Attempt with availability_domain_index=${ad_index} ---"
            terraform plan -out=tfplan -input=false \
              -var "availability_domain_index=${ad_index}"

            if terraform apply -input=false tfplan 2>&1 | tee /tmp/tf_apply.log; then
              echo "Apply succeeded on AD index ${ad_index}"
              exit 0
            fi

            if grep -q "Out of host capacity" /tmp/tf_apply.log; then
              echo "Out of capacity on AD ${ad_index}, trying next in 10s..."
              sleep 10
            else
              echo "Apply failed for a non-capacity reason, aborting."
              cat /tmp/tf_apply.log
              exit 1
            fi
          done

          echo "All 3 ADs exhausted. Retry the workflow later or change OCI_REGION."
          exit 1

      - name: Upload final plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7

      - name: Show outputs
        run: terraform output
