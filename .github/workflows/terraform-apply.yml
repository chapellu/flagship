name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:

jobs:
  apply:
    name: Plan & Apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra

    env:
      TF_VAR_tenancy_ocid:     ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid:        ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint:      ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: /tmp/oci_api_key.pem
      TF_VAR_region:           ${{ secrets.OCI_REGION }}
      TF_VAR_compartment_id:   ${{ secrets.OCI_COMPARTMENT_ID }}
      TF_VAR_ssh_public_key:   ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Write OCI private key
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Init
        run: terraform init

      - name: Plan & Apply (with capacity retry)
        shell: bash
        run: |
          # OCI A2.Flex free-tier capacity is scarce. Strategy:
          #   - Cycle through AD indices 0/1/2 (Terraform uses modulo so single-AD
          #     regions like eu-paris-1 always stay on AD 0 without an index error).
          #   - On capacity failure, wait WAIT_SECS before the next attempt.
          #   - Abort immediately on any non-capacity error.
          MAX_ATTEMPTS=100
          WAIT_SECS=120

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            ad_index=$(( (attempt - 1) % 3 ))
            echo "=== Attempt ${attempt}/${MAX_ATTEMPTS} — availability_domain_index=${ad_index} ==="

            terraform plan -out=tfplan -input=false \
              -var "availability_domain_index=${ad_index}"

            apply_exit=0
            terraform apply -input=false tfplan > /tmp/tf_apply.log 2>&1 || apply_exit=$?
            cat /tmp/tf_apply.log

            if [ "$apply_exit" -eq 0 ]; then
              echo "Apply succeeded on attempt ${attempt} (AD index ${ad_index})"
              exit 0
            fi

            if grep -q "Out of host capacity" /tmp/tf_apply.log; then
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "Out of capacity. Waiting ${WAIT_SECS}s before attempt $((attempt + 1))..."
                sleep $WAIT_SECS
              fi
            else
              echo "Apply failed for a non-capacity reason, aborting."
              exit 1
            fi
          done

          echo "Capacity unavailable after ${MAX_ATTEMPTS} attempts. Try again later or change OCI_REGION."
          exit 1

      - name: Upload final plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7

      - name: Show outputs
        run: terraform output
