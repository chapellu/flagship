name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      region:
        description: 'OCI region override. Leave empty to use OCI_REGION secret.'
        required: false
        default: ''

jobs:
  apply:
    name: Plan & Apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra

    env:
      TF_VAR_tenancy_ocid:     ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid:        ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint:      ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: /tmp/oci_api_key.pem
      TF_VAR_region:           ${{ inputs.region != '' && inputs.region || secrets.OCI_REGION }}
      TF_VAR_compartment_id:   ${{ secrets.OCI_COMPARTMENT_ID }}
      TF_VAR_ssh_public_key:   ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Write OCI private key
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Init
        run: terraform init

      - name: Plan & Apply (A2.Flex → A1.Flex with capacity retry)
        shell: bash
        run: |
          # Try A2.Flex (Ampere Altra, paid) first for 10 attempts, then fall back
          # to A1.Flex (Ampere A1, Always Free) for 100 attempts.
          # AD index cycles 0/1/2 with modulo so single-AD regions stay valid.
          WAIT_SECS=120

          for shape_config in "VM.Standard.A2.Flex:10" "VM.Standard.A1.Flex:100"; do
            shape="${shape_config%%:*}"
            max_attempts="${shape_config##*:}"
            echo "### Trying shape: ${shape} (max ${max_attempts} attempts) ###"

            for attempt in $(seq 1 "$max_attempts"); do
              ad_index=$(( (attempt - 1) % 3 ))
              echo "=== ${shape} — Attempt ${attempt}/${max_attempts} — AD index ${ad_index} ==="

              terraform plan -out=tfplan -input=false \
                -var "availability_domain_index=${ad_index}" \
                -var "shape=${shape}"

              apply_exit=0
              terraform apply -input=false tfplan > /tmp/tf_apply.log 2>&1 || apply_exit=$?
              cat /tmp/tf_apply.log

              if [ "$apply_exit" -eq 0 ]; then
                echo "Apply succeeded with shape ${shape} on attempt ${attempt}"
                exit 0
              fi

              if grep -q "Out of host capacity" /tmp/tf_apply.log; then
                if [ "$attempt" -lt "$max_attempts" ]; then
                  echo "Out of capacity. Waiting ${WAIT_SECS}s before next attempt..."
                  sleep $WAIT_SECS
                else
                  echo "All ${max_attempts} attempts exhausted for ${shape}, trying next shape..."
                fi
              else
                echo "Apply failed for a non-capacity reason, aborting."
                exit 1
              fi
            done
          done

          echo "All shapes and attempts exhausted. Retry later or check OCI capacity."
          exit 1

      - name: Upload final plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7

      - name: Show outputs
        run: terraform output
