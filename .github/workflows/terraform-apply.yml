name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      region:
        description: 'OCI region override. Leave empty to use OCI_REGION secret.'
        required: false
        default: ''
      allow_instance_rebuild:
        description: 'Allow a plan that destroys vm-main or re-images its boot disk (wipes k3s, PVs, /home/ubuntu).'
        type: boolean
        required: false
        default: false

# Least privilege: applies only need to read the repo. All cloud credentials
# come from environment secrets, not the GITHUB_TOKEN.
permissions:
  contents: read

# Serialize applies. The native OCI backend locks state, so this is a
# second line of defence: it stops a redundant run (push + manual dispatch,
# or overlapping merges) from spinning up a runner only to block for hours
# on the state lock while the in-progress capacity-retry loop runs. Queued
# runs wait rather than cancel so no apply is lost.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Plan & Apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra

    env:
      TF_VAR_tenancy_ocid:     ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid:        ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint:      ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: /tmp/oci_api_key.pem
      TF_VAR_region:           ${{ inputs.region != '' && inputs.region || secrets.OCI_REGION }}
      TF_VAR_compartment_id:   ${{ secrets.OCI_COMPARTMENT_ID }}
      TF_VAR_ssh_public_key:   ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_github_token:     ${{ secrets.GH_PAT }}

    steps:
      - uses: actions/checkout@v4

      - name: Write OCI private key
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: Init
        env:
          TF_BACKEND_NAMESPACE:   ${{ secrets.OCI_NAMESPACE }}
          TF_BACKEND_REGION:      ${{ secrets.OCI_REGION }}
          TF_BACKEND_TENANCY:     ${{ secrets.OCI_TENANCY_OCID }}
          TF_BACKEND_USER:        ${{ secrets.OCI_USER_OCID }}
          TF_BACKEND_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          touch /tmp/oci_backend.hcl
          chmod 600 /tmp/oci_backend.hcl
          cat > /tmp/oci_backend.hcl <<EOF
          namespace        = "${TF_BACKEND_NAMESPACE}"
          region           = "${TF_BACKEND_REGION}"
          tenancy_ocid     = "${TF_BACKEND_TENANCY}"
          user_ocid        = "${TF_BACKEND_USER}"
          fingerprint      = "${TF_BACKEND_FINGERPRINT}"
          private_key_path = "/tmp/oci_api_key.pem"
          EOF
          terraform init -backend-config=/tmp/oci_backend.hcl
          rm -f /tmp/oci_backend.hcl

      - name: Plan & Apply (with capacity retry)
        shell: bash
        env:
          ALLOW_INSTANCE_REBUILD: ${{ inputs.allow_instance_rebuild && 'true' || 'false' }}
        run: |
          # Retry up to 100 times with 120s between attempts.
          # AD index cycles 0/1/2 with modulo so single-AD regions stay valid.
          # Shape is fixed per run — change it explicitly via workflow_dispatch input
          # or by updating the 'shape' Terraform variable. Do NOT auto-fallback
          # between shapes: A2.Flex is paid and switching shapes destroys the instance.
          MAX_ATTEMPTS=300
          WAIT_SECS=30

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            ad_index=$(( (attempt - 1) % 3 ))
            echo "=== Attempt ${attempt}/${MAX_ATTEMPTS} — AD index ${ad_index} ==="

            terraform plan -out=tfplan -input=false \
              -var "availability_domain_index=${ad_index}"

            # Guard: never wipe vm-main as a side effect. On 2026-11-02 a
            # DNS-only push re-imaged the boot disk because a newer Ubuntu image
            # changed source_details.source_id. That is an in-place "update" on
            # OCI, not a delete, so both cases are checked.
            if [ "${ALLOW_INSTANCE_REBUILD}" != "true" ]; then
              danger=$(terraform show -json tfplan | jq -r '
                .resource_changes[]?
                | select(.address == "oci_core_instance.main")
                | select((.change.actions | index("delete"))
                         or ((.change.actions | index("update"))
                             and (.change.before.source_details[0].source_id != .change.after.source_details[0].source_id)))
                | .change.actions | join("+")')
              if [ -n "$danger" ]; then
                echo "::error::This plan would destroy or re-image vm-main (${danger}). Refusing to apply."
                echo "If that is intended, run this workflow by hand with allow_instance_rebuild=true."
                exit 1
              fi
            fi

            apply_exit=0
            terraform apply -input=false tfplan > /tmp/tf_apply.log 2>&1 || apply_exit=$?
            cat /tmp/tf_apply.log

            if [ "$apply_exit" -eq 0 ]; then
              echo "Apply succeeded on attempt ${attempt}"
              exit 0
            fi

            if grep -q "Out of host capacity" /tmp/tf_apply.log; then
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "Out of capacity. Waiting ${WAIT_SECS}s before attempt $((attempt + 1))..."
                sleep $WAIT_SECS
              fi
            else
              echo "Apply failed for a non-capacity reason, aborting."
              exit 1
            fi
          done

          echo "Capacity unavailable after ${MAX_ATTEMPTS} attempts. Retry later or change OCI_REGION."
          exit 1

      # NOTE: the binary plan (infra/tfplan) is intentionally NOT uploaded as an
      # artifact. A saved plan can embed resolved sensitive variable values
      # (SSH private key, GitHub PAT) in plaintext, and artifacts are
      # downloadable by anyone with repo read access.

      - name: Show outputs
        run: terraform output
