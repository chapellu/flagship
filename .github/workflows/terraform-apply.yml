name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      region:
        description: 'OCI region override. Leave empty to use OCI_REGION secret.'
        required: false
        default: ''

jobs:
  apply:
    name: Plan & Apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra

    env:
      TF_VAR_tenancy_ocid:     ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid:        ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint:      ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: /tmp/oci_api_key.pem
      TF_VAR_region:           ${{ inputs.region != '' && inputs.region || secrets.OCI_REGION }}
      TF_VAR_compartment_id:   ${{ secrets.OCI_COMPARTMENT_ID }}
      TF_VAR_ssh_public_key:   ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_ssh_private_key:  ${{ secrets.SSH_PRIVATE_KEY }}
      TF_VAR_github_token:     ${{ secrets.GH_PAT }}

    steps:
      - uses: actions/checkout@v4

      - name: Write OCI private key
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Init
        run: terraform init

      - name: Plan & Apply (with capacity retry)
        shell: bash
        run: |
          # Retry up to 100 times with 120s between attempts.
          # AD index cycles 0/1/2 with modulo so single-AD regions stay valid.
          # Shape is fixed per run — change it explicitly via workflow_dispatch input
          # or by updating the 'shape' Terraform variable. Do NOT auto-fallback
          # between shapes: A2.Flex is paid and switching shapes destroys the instance.
          MAX_ATTEMPTS=300
          WAIT_SECS=30

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            ad_index=$(( (attempt - 1) % 3 ))
            echo "=== Attempt ${attempt}/${MAX_ATTEMPTS} — AD index ${ad_index} ==="

            terraform plan -out=tfplan -input=false \
              -var "availability_domain_index=${ad_index}"

            apply_exit=0
            terraform apply -input=false tfplan > /tmp/tf_apply.log 2>&1 || apply_exit=$?
            cat /tmp/tf_apply.log

            if [ "$apply_exit" -eq 0 ]; then
              echo "Apply succeeded on attempt ${attempt}"
              exit 0
            fi

            if grep -q "Out of host capacity" /tmp/tf_apply.log; then
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "Out of capacity. Waiting ${WAIT_SECS}s before attempt $((attempt + 1))..."
                sleep $WAIT_SECS
              fi
            else
              echo "Apply failed for a non-capacity reason, aborting."
              exit 1
            fi
          done

          echo "Capacity unavailable after ${MAX_ATTEMPTS} attempts. Retry later or change OCI_REGION."
          exit 1

      - name: Upload final plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7

      - name: Show outputs
        run: terraform output
